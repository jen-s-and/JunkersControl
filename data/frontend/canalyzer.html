<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CERASMARTER Can Analyzer</title>
    <link rel="stylesheet" href="frontend/css/bootstrap.min.css">
    <link rel="stylesheet" href="frontend/css/bootstrap-icons.css">
    <style>
        .analyzer-panel{min-height:500px}.parameter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.75rem}.parameter-card{border:1px solid var(--bs-border-color);border-radius:.5rem;padding:.75rem;background:rgba(255,255,255,.72)}.parameter-card.updated{box-shadow:inset 4px 0 0 var(--bs-info)}.parameter-value{font-size:1.35rem;font-weight:650;line-height:1.2;overflow-wrap:anywhere}.raw-log{height:500px}.body-table td,.body-table th{vertical-align:middle}body.theme-dark .parameter-card{background:#172033;border-color:#2f3d52}
    </style>
</head>

<body>
<div id="navigation-container"><!-- Navigation Placeholder --></div>
<div class="container-fluid px-3 px-lg-4">
    <div class="row g-4">
        <div class="col-lg-3 text-start">
            <div class="mt-4">
                <h4>Options and Utilities</h4>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="ignoreKnown">
                    <label class="form-check-label" for="ignoreKnown">Ignore Known Addresses</label>
                </div>
            </div>
            <div class="mt-4"><h5>Known Addresses</h5><div class="row mt-3" id="known-addresses"></div></div>
            <div class="mt-4"><h5>Unknown Addresses</h5><div class="row mt-3" id="unknown-addresses"></div></div>
        </div>
        <div class="col-lg-9">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mt-4">
                <div><h3 class="mb-1">CAN Analyzer</h3><div class="text-muted">Live view of raw frames and translated heating parameters</div></div>
                <div class="btn-group" role="group" aria-label="Analyzer view">
                    <input type="radio" class="btn-check" name="analyzer-view" id="view-translated" autocomplete="off" checked>
                    <label class="btn btn-outline-primary" for="view-translated"><i class="bi bi-card-checklist"></i> Klartext</label>
                    <input type="radio" class="btn-check" name="analyzer-view" id="view-raw" autocomplete="off">
                    <label class="btn btn-outline-primary" for="view-raw"><i class="bi bi-braces"></i> Rohdaten</label>
                </div>
            </div>
            <div id="translated-view" class="analyzer-panel mt-4"><div class="parameter-grid" id="translated-parameters"></div></div>
            <div id="raw-view" class="analyzer-panel mt-4 d-none">
                <div class="row overflow-auto border border-1 rounded align-content-start raw-log" id="can-msg-log">
                    <table class="table table-bordered align-top body-table mb-0">
                        <thead class="sticky-top bg-light"><tr class="sticky-top bg-light"><th class="sticky-top">&#8651;</th><th class="sticky-top">ID</th><th class="sticky-top">1</th><th class="sticky-top">2</th><th class="sticky-top">3</th><th class="sticky-top">4</th><th class="sticky-top">5</th><th class="sticky-top">6</th><th class="sticky-top">7</th><th class="sticky-top">8</th></tr></thead>
                        <tbody id="can-msg"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="frontend/js/framework.js"></script>
<script src="frontend/js/api.js"></script>
<script src="frontend/js/firmware.js"></script>
<script src="frontend/js/bootstrap.bundle.min.js"></script>
<script src="frontend/js/cananalyzer.js"></script>
</body>
</html>
