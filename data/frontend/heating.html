<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cerasmarter Heating Status</title>
    <link rel="stylesheet" href="frontend/css/bootstrap.min.css">
    <link rel="stylesheet" href="frontend/css/bootstrap-icons.css">
</head>

<body>
    <div id="navigation-container"></div>
    <main class="container py-4">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
            <div>
                <h1 class="h3 mb-1" data-i18n="heating.title">Heating Status</h1>
                <p class="text-muted mb-0" data-i18n="heating.subtitle">Active ESP parameters, live values and calculated heating curve.</p>
            </div>
            <span class="badge rounded-pill text-bg-secondary" id="mqtt-state">MQTT: --</span>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-lg-8">
                <div class="card h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span data-i18n="heating.curve">Heating curve</span>
                        <span class="small text-muted" id="curve-summary">--</span>
                    </div>
                    <div class="card-body">
                        <div id="curve-chart" class="w-100"></div>
                        <div class="row g-2 mt-3" id="curve-points"></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card h-100">
                    <div class="card-header" data-i18n="heating.effectiveState">Effective state</div>
                    <div class="card-body">
                        <div class="d-grid gap-2" id="effective-state"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-xl-6">
                <div class="card h-100">
                    <div class="card-header" data-i18n="heating.receivedParameters">Received parameters</div>
                    <div class="table-responsive">
                        <table class="table table-sm align-middle mb-0">
                            <tbody id="command-table"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-xl-6">
                <div class="card h-100">
                    <div class="card-header" data-i18n="heating.boilerBusCurrent">Boiler / bus current</div>
                    <div class="table-responsive">
                        <table class="table table-sm align-middle mb-0">
                            <tbody id="current-table"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="frontend/js/bootstrap.bundle.min.js"></script>
    <script src="frontend/js/framework.js"></script>
    <script src="frontend/js/heating.js"></script>
    <script>loadNavigation();</script>
</body>

</html>
